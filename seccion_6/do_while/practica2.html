<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practica2</title>
</head>
<body>
    <script>
        let numero = parseInt(prompt("TABLAS DE MULTIPLICAR"));
        
        function multiplicar() {
            let contador = 1;

            do {
                console.log(numero + " x " + contador + " = " + (numero * contador));
                contador++;
            } while (contador <= 10);
        }

        multiplicar();
    </script>
</body>
</html>
