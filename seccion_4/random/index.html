<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>random</title>
</head>
<body>
    <button onclick="crearAleatorio(10, 15)">click</button>
    <h2>numero aleatorio: <span id="textoAleatorio">---</span></h2>
    <script>
        let elementoAleatorio = document.getElementById("textoAleatorio");

        function crearAleatorio(minimo, maximo){
            maximo = minimo + 1;
            resultado = Math.floor(Math.random() * (maximo - minimo) + minimo);
            elementoAleatorio.textContent = resultado;
        }
    </script>
</body>
</html>
