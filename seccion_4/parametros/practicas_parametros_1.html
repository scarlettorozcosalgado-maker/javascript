<!DOCTYPE html>
<html>
<head>
    <title>Parámetros 1</title>
</head>
<body>
    <p>
        <button onclick="suma(9, 90)">Click aquí</button>
    </p>
    <script>
        function suma(numero1, numero2) {
            let resultado = numero1 + numero2;
            alert("El resultado es: " + resultado);
        }
    </script>
</body>
</html>
