<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cotidiano</title>
</head>
<body>
<link rel="stylesheet" href="misEstilo.css">

  <h2>CALCULADORA</h2>

    <input type="number" id="n1">
    <input type="number" id="n2">

    <button onclick="suma()">+</button><br>
    <button onclick="resta()">-</button>
    <button onclick="multiplicacion()" >X</button><br>
    <button onclick="divison()">/</button>
    <button onclick="raiz()">raiz</button><br>
    <button onclick="absoluto()">absoluto</button>
    <button onclick="potencia()">potencia</button>
    <button onclick="random(n1,n2)" >random</button>

    <h2>resultado</h2>

    <input type="number" id="resultado">

    <button onclick="round()">round</button>
    <button onclick="floor()">floor</button>
    <button onclick="ceil()">ceil</button>

    <script>
      function suma(){
      let numero1 = parseInt (document.getElementById("n1").value);
      let numero2 = parseInt (document.getElementById("n2").value);
      let operacion = numero1 + numero2
      document.getElementById("resultado").value = operacion;
      }

      function resta(){
        let numero1 = parseInt (document.getElementById("n1").value);
        let numero2 = parseInt(document.getElementById("n2").value);
        let total = numero1 - numero2
        document.getElementById("resultado").value = total;
      }
      function multiplicacion(){
        let numero1 = parseInt (document.getElementById("n1").value);
        let numero2 = parseInt (document.getElementById("n2").value);
        let total = numero1 * numero2
        document.getElementById("resultado").value = total;
      }
      function divison(){
        let numero1 = parseInt (document.getElementById("n1").value);
        let numero2 = parseInt (document.getElementById("n2").value);
        let total = numero1 / numero2
        document.getElementById("resultado").value = total;
      }
      function raiz(){
        let numero1 = parseInt (document.getElementById("n1").value);
        let numero2 = parseInt (document.getElementById("n2").value);
        let total = Math.sqrt (numero1, numero2)
        document.getElementById("resultado").value = total;
      }
      function absoluto(){
        let numero1 = parseInt (document.getElementById("n1").value);
        let numero2 = parseInt (document.getElementById("n2").value);
        let total = Math.abs(numero1, numero2)
        document.getElementById("resultado").value = total;
      }
      function potencia(){
        let numero1 = parseInt (document.getElementById("n1").value);
        let numero2 = parseInt (document.getElementById("n2").value);
        let total = numero1 ** numero2
        document.getElementById("resultado").value = total;
      }
      function random(minimo, maximo){
        let numero1 = parseInt (document.getElementById("n1").value);
        let numero2 = parseInt (document.getElementById("n2").value);
        let total = Math.random(n1,n2) 
        document.getElementById("resultado").value = total;
      }
      function round(){

        total = Math.round(document.getElementById("resultado").value)
        document.getElementById("resultado").value = total; 
      }
      function floor(){
        total = Math.floor(document.getElementById("resultado").value)
        document.getElementById("resultado").value = total;
      }
      function ceil(){
        total = Math.ceil(document.getElementById("resultado").value)
        document.getElementById("resultado").value = total;
      }

    </script>

  </div>

</body>
</html>
