<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>return</title>

</head>
<body>
    <p>
        <button onclick="mostrarResultado()">click aquí</button>
    </p>
    <script>
        function mostrarResultado(){
            let resultado = sumar();
            alert(resultado);

        function sumar(){
         let resultado =  15 + 19;
         return resultado
        }
    </script>
